<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Data Siswa</title>
  </head>

  <body>
    <form action="/submit" method="POST">
      <h2>Form Data Siswa</h2>
      <fieldset>
        <legend>Informasi Siswa</legend>

        <div>
          <label for="nis">NIS *</label>
          <input type="text" id="nis" name="nis" required />
        </div>

        <div>
          <label for="nama">Nama Lengkap *</label>
          <input type="text" id="nama" name="nama" required />
        </div>

        <div>
          <label for="jk">Jenis Kelamin *</label>
          <select id="jk" name="jenis_kelamin" required>
            <option value="">--Pilih--</option>
            <option value="Laki-laki">Laki-laki</option>
            <option value="Perempuan">Perempuan</option>
          </select>
        </div>

        <div>
          <label for="tempat-lahir">Tempat Lahir *</label>
          <input type="text" id="tempat-lahir" name="tempat_lahir" required />
        </div>

        <div>
          <label for="tanggal-lahir">Tanggal Lahir *</label>
          <input type="date" id="tanggal-lahir" name="tanggal_lahir" required />
        </div>

        <div>
          <label for="alamat">Alamat *</label>
          <textarea id="alamat" name="alamat" rows="3" required></textarea>
        </div>

        <div>
          <label for="telepon">No. Telepon *</label>
          <input type="tel" id="telepon" name="telepon" required />
        </div>

        <div>
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div>
          <button type="submit">Kirim</button>
          <button type="reset">Reset</button>
        </div>
      </fieldset>
    </form>
    <br />

    <!-- navigasi antar halaman -->
    <a href="index.html">halaman utama</a>
    <a href="detail.html">halaman detail</a>
  </body>
</html>

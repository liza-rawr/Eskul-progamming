<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini project 2: CSS display Gallery</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: white;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .Gallery {
            border: 2px solid #ccc;
            padding: 10px;
        }

        .item {
            display: inline-block;
            width: 150px;
            height: 150px;
            margin: 10px;
            background-color: #eee;
            text-align: center;
            line-height: 150px;
            border-radius: 8px;
            border: 1px solid #bbb;
        }

        .item:hover {
            background-color: #ddd;

        }

        .caption {
            display: block;
            margin-top: 5px;
            text-align: center;
            text-align: center;
            font-size: 14px;
            color: #555;
        }

        .desc span {
            display: none;
            color: yellow;

        .hidden-message {
        display: none;
                color: red;
            }
        }
    </style>
</head>
<body>
    <h1>Mini Project 2: CSS Display Gallery</h1>
    <div class="Gallery">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>

    <p class="desc">
        Teks ini punya <span>highlight</span> ditengah kalimat
    </p>

    <p class="hidden-messsage">Pesan rahasia ini disembunyikan dengan display: none;</p>
    
    <p class="caption">Hover di kotak untuk melihat efeknya</p>

</body>
</html>
